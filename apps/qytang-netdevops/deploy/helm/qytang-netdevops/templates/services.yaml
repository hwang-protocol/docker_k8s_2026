apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: qytang-netdevops
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: device-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: device-service
    app.kubernetes.io/part-of: qytang-netdevops
spec:
  selector:
    app: device-service
  ports:
    - name: http
      port: {{ .Values.deviceService.service.port | default 8001 }}
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: resource-service
    app.kubernetes.io/part-of: qytang-netdevops
spec:
  selector:
    app: resource-service
  ports:
    - name: http
      port: {{ .Values.resourceService.service.port | default 8002 }}
      targetPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/part-of: qytang-netdevops
spec:
  selector:
    app: audit-service
  ports:
    - name: http
      port: {{ .Values.auditService.service.port | default 8003 }}
      targetPort: 8003
