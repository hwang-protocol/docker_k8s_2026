namespace: qytang-netdevops

global:
  imagePullSecrets: []

observability:
  environment: lab
  otel:
    endpoint: http://otel-opentelemetry-collector.observability:4317

# 这是 Helm Chart 的默认模板值。
# 当前 Argo CD 演示环境主要以 values-lab.yaml 为准。
frontend:
  # 默认参考值。
  replicaCount: 1
  image:
    repository: harbor.qytk8s.com/qytang-netdevops/frontend
    tag: v0.2.3
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080

deviceService:
  # 默认参考值。
  replicaCount: 1
  image:
    repository: harbor.qytk8s.com/qytang-netdevops/device-service
    tag: v0.2.3
    pullPolicy: IfNotPresent
  service:
    port: 8001

resourceService:
  # 默认参考值。
  replicaCount: 1
  image:
    repository: harbor.qytk8s.com/qytang-netdevops/resource-service
    tag: v0.2.3
    pullPolicy: IfNotPresent
  service:
    port: 8002

auditService:
  # 默认参考值。
  replicaCount: 1
  image:
    repository: harbor.qytk8s.com/qytang-netdevops/audit-service
    tag: v0.2.3
    pullPolicy: IfNotPresent
  service:
    port: 8003

postgres:
  # 默认参考值：当前 PostgreSQL 使用单实例 PVC。
  enabled: true
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  database: netdevops
  username: netdevops
  password: NetDevOps12345
  storage:
    storageClassName: longhorn
    accessMode: ReadWriteOnce
    size: 5Gi
