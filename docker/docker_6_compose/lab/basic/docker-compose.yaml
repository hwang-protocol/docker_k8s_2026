services:
  nginx:
    image: nginx:1.29.1
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:80"
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend

  app:
    build:
      context: ./app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV}"
      APP_PORT: "${APP_PORT}"
      CACHE_HOST: "${CACHE_HOST}"
      CACHE_PORT: "${CACHE_PORT}"
    expose:
      - "${APP_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT}/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    user: "10001:10001"
    networks:
      - backend

  redis:
    image: redis:8.2.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - backend

volumes:
  redisdata:

networks:
  frontend:
  backend:
