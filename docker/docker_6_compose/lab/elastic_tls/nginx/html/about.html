  <h1>关于本实验</h1>
  <p>本静态站点用于配合 Docker Compose TLS/ELK 实验：Nginx 将访问日志写入本地文件，Filebeat 通过共享卷采集并上报至 Elasticsearch，在 Kibana 中即可分析请求路径、状态码、Referer、User-Agent 等。</p>
  <p>多设计几个页面并加上超链接，可以在短时间内产生多样化的请求，便于在 Kibana 中做筛选、聚合与可视化。</p>
