apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netdevops-http-redirect
  namespace: gateway-demo
spec:
  hostnames:
    - netdevops.qytk8s.com
  parentRefs:
    - name: app-gateway
      sectionName: netdevops-http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netdevops-https-backend
  namespace: gateway-demo
spec:
  hostnames:
    - netdevops.qytk8s.com
  parentRefs:
    - name: app-gateway
      sectionName: netdevops-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          namespace: qytang-netdevops
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-demo-to-qytang-netdevops-frontend
  namespace: qytang-netdevops
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: gateway-demo
  to:
    - group: ""
      kind: Service
      name: frontend
