services:
  postgres:
    image: harbor.qytk8s.com/library/postgres:17
    container_name: gitea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: GiteaPg12345
    volumes:
      - /data/gitea/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 3s
      retries: 20

  gitea:
    image: harbor.qytk8s.com/library/gitea:1.25.4
    container_name: gitea
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: GiteaPg12345
      GITEA__server__DOMAIN: git.qytk8s.com
      GITEA__server__ROOT_URL: https://git.qytk8s.com/
      GITEA__server__PROTOCOL: https
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__CERT_FILE: /certs/git.qytk8s.com.crt
      GITEA__server__KEY_FILE: /certs/git.qytk8s.com.key
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__repository__DEFAULT_BRANCH: main
    ports:
      - "443:3000"
      - "2222:22"
    volumes:
      - /data/gitea/data:/data
      - /data/gitea/cert:/certs:ro
