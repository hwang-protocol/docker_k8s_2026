apiVersion: apps/v1
kind: Deployment
metadata:
  name: qytang-deployment-volume-demo
  namespace: qytang-stateful-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qytang-deployment-volume-demo
  template:
    metadata:
      labels:
        app: qytang-deployment-volume-demo
    spec:
      nodeSelector:
        node-role: app
      containers:
        - name: busybox
          image: harbor.qytk8s.com/storage/busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - |
              echo "volume demo container started"
              sleep infinity
          volumeMounts:
            - name: qytang-volumes-demo
              mountPath: /data
      volumes:
        - name: qytang-volumes-demo
          persistentVolumeClaim:
            claimName: qytang-pvc-demo
