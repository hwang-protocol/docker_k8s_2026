      sectionName: netdevops-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          namespace: qytang-netdevops
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
