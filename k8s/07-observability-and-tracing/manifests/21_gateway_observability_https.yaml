apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-http-redirect
  namespace: gateway-demo
spec:
  hostnames:
    - grafana.qytk8s.com
  parentRefs:
    - name: app-gateway
      sectionName: grafana-http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-https-backend
  namespace: gateway-demo
spec:
  hostnames:
    - grafana.qytk8s.com
  parentRefs:
    - name: app-gateway
      sectionName: grafana-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kps-grafana
          namespace: monitoring
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-demo-to-kps-grafana
  namespace: monitoring
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: gateway-demo
  to:
    - group: ""
      kind: Service
      name: kps-grafana
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger-http-redirect
  namespace: gateway-demo
spec:
  hostnames:
    - jaeger.qytk8s.com
  parentRefs:
    - name: app-gateway
      sectionName: jaeger-http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger-https-backend
  namespace: gateway-demo
spec:
  hostnames:
    - jaeger.qytk8s.com
  parentRefs:
    - name: app-gateway
      sectionName: jaeger-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jaeger
          namespace: observability
          port: 16686
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-demo-to-jaeger
  namespace: observability
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: gateway-demo
  to:
    - group: ""
      kind: Service
      name: jaeger
