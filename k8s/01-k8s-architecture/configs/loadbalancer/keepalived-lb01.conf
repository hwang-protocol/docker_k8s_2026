global_defs {
   router_id LB01
}

vrrp_script chk_haproxy {
   script "/etc/keepalived/check_haproxy.sh"
   interval 2
   weight 10
}

vrrp_instance VI_K8S_API {
    state MASTER
    interface ens160
    virtual_router_id 51
    priority 200
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass K8S2026
    }

    unicast_src_ip 10.1.1.11
    unicast_peer {
        10.1.1.12
    }

    virtual_ipaddress {
        10.1.1.10/24 dev ens160
    }

    track_script {
        chk_haproxy
    }
}
