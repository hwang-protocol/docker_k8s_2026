apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: mesh-demo
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: mesh-demo
  labels:
    app: httpbin
    service: httpbin
    istio.io/use-waypoint: waypoint
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8080
  selector:
    app: httpbin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: mesh-demo
  labels:
    app: httpbin
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v1
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: harbor.qytk8s.com/istio/httpbin:v2.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
