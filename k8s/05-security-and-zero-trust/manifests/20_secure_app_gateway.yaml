apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: secure-app-gateway
  namespace: mesh-demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - secure-app.qytk8s.com
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - secure-app.qytk8s.com
      tls:
        mode: SIMPLE
        credentialName: secure-app-qytk8s-com-tls
