apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: whoami-l7-allow-get
  namespace: net-demo
spec:
  endpointSelector:
    matchLabels:
      app: whoami
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: client
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/"
