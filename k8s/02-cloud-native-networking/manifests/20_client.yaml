apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: net-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: harbor.qytk8s.com/cilium/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - sleep infinity
