apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: workers-to-vyos-rr
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  bgpInstances:
    - name: worker-as65001
      localASN: 65001
      peers:
        - name: vyos-rr
          peerASN: 65001
          peerAddress: 10.1.1.254
          peerConfigRef:
            name: vyos-rr-peer
